server:
  port: ${XINYU_PORT:8080}

spring:
  application:
    name: xinyu-soulisle
  web:
    resources:
      # 直读前端权威源，不做第二份副本 —— 避开「src → deploy/xinyu」之外的第三处同步点。
      # 相对路径基于 JVM 工作目录：从项目根执行 java -jar server/target/soulisle-server.jar 即命中 src/。
      static-locations: file:${XINYU_WEB_ROOT:./src/}
      cache:
        period: 0
  datasource:
    # 默认 H2 文件库（演示即可持久，落 server/data/ 已 ignore）；生产切 MySQL：
    #   XINYU_DB_URL=jdbc:mysql://host:3306/xinyu?serverTimezone=Asia/Shanghai
    #   XINYU_DB_DRIVER=com.mysql.cj.jdbc.Driver  XINYU_DB_USER=...  XINYU_DB_PASSWORD=...
    url: ${XINYU_DB_URL:jdbc:h2:file:./server/data/xinyu;MODE=MySQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${XINYU_DB_DRIVER:org.h2.Driver}
    username: ${XINYU_DB_USER:sa}
    password: ${XINYU_DB_PASSWORD:}
    # r169 连接池。此前整节零配置 ⇒ 全部吃 HikariCP 默认值：最多 10 条连接、借不到就等 30s、
    # 无泄漏检测、连接不按时长轮换。两个后果在本项目里是可观测的缺陷而非理论风险：
    #   ① 库挂掉时每个请求要挂满 30s 才失败 —— 与「不可达要快速回落」这条要求正好相反；
    #   ② MySQL 侧 wait_timeout 默认 8h，而连接池里的空闲连接可能被中间层（NAT/LB/代理）
    #      静默掐断，下一次借出就是一句 Communications link failure。
    # 处理方式：把连接生命周期主动收回来（max-lifetime 29min < 8h），并把借连接预算压到 5s。
    # 每项都可被环境变量覆盖，演示形态（零配置）仍然一行不用改。
    hikari:
      pool-name: XinyuPool
      maximum-pool-size: ${XINYU_DB_POOL_MAX:16}
      minimum-idle: ${XINYU_DB_POOL_MIN:2}
      connection-timeout: ${XINYU_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${XINYU_DB_VALIDATION_TIMEOUT_MS:2500}
      max-lifetime: ${XINYU_DB_MAX_LIFETIME_MS:1740000}
      leak-detection-threshold: ${XINYU_DB_LEAK_DETECT_MS:20000}
  sql:
    init:
      # r169：DDL 归 Flyway（见下方 spring.flyway）。这一行留着并置 never，是为了让
      # 「临时绕开 Flyway、回到旧的每轮全量跑脚本」仍然是一个环境变量能表达的状态
      # （XINYU_SQL_INIT_MODE=always）——逃生门要看得见，不能靠改代码回来。
      # 注意 never 只关「跑脚本」，不关「表已存在」：两侧库都由 Flyway 建。
      mode: ${XINYU_SQL_INIT_MODE:never}
  flyway:
    enabled: ${XINYU_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    # 存量库（已有 chat_message/emotion_record 而无 flyway_schema_history）第一次接 Flyway
    # 时会因「非空库没有历史表」直接报错 —— baseline-on-migrate 把它基线化后再前滚。
    # baseline-version 取 0 而不是默认的 1：默认值会让 V1 被当成「基线已含」而跳过，
    # 于是 V1 在存量库上永不执行；取 0 则 V1 照常跑，靠脚本自身的 IF NOT EXISTS 保持幂等。
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: pre-flyway J4 schema
    validate-on-migrate: true
    # 硬闸：clean 会整库 DROP。演示机上随手一个 flyway.clean 就把别人的数据清了。
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

xinyu:
  stage: J5
  # 可选鉴权：留空 = 完全放行（演示默认）；非空则 /api/**（除 /api/health）需带 X-Xinyu-Token
  api-token: ${XINYU_API_TOKEN:}
  web-root: ${XINYU_WEB_ROOT:./src/}
  # r128 成本面/内存面防护闸（ApiGuardFilter）：/api/chat 每调一次真花一次上游的钱，
  # 而此前全仓零限流（实测 rateLimit|429|quota|Retry-Forward 在 server/src/main/java 下 0 命中）。
  # 默认值刻意给得宽松（60/min，桶容量 20）：宁可在极端滥用下多花一点，也不能打断
  # 既有 180 条回归电池里的自调用。per-minute 配成 0 = 关闭限流（只留体上限）。
  guard:
    enabled: ${XINYU_GUARD_ENABLED:true}
    rate-limit-per-minute: ${XINYU_GUARD_RATE_LIMIT_PER_MIN:60}
    burst: ${XINYU_GUARD_BURST:20}
    # 请求体上限 256 KiB：正常对话（messages 数组 + system 提示）远低于此，
    # 超限直接 413 且不进 LLM。配成 0 = 不限体。
    max-body-bytes: ${XINYU_GUARD_MAX_BODY_BYTES:262144}
  # r128 结构化访问日志（AccessLogFilter）：只记元数据，绝不记请求体/响应体/密钥。
  access-log:
    enabled: ${XINYU_ACCESS_LOG_ENABLED:true}
  # r130 成本面**总量闸**（QuotaFilter + UsageLedger）：上面的令牌桶只堵「单位时间内来得快」，
  # 结构上挡不住「每分钟 1 次、一天 1440 次」的慢速白嫖 ⇒ 补按自然日累计与日额熔断。
  # daily-tokens 默认 0 = 不限：token 是「字节数/4」的粗估，不是上游计费口径，
  # 拿它做硬门槛前请先确认自己能接受这个误差（/api/usage 会如实标 tokensAreEstimated=true）。
  quota:
    enabled: ${XINYU_QUOTA_ENABLED:true}
    # 默认 2000/日刻意宽松：宁可多花一点，也不能打断既有 185 条回归电池的自调用
    daily-requests: ${XINYU_QUOTA_DAILY_REQUESTS:2000}
    daily-tokens: ${XINYU_QUOTA_DAILY_TOKENS:0}
    # 默认只计量 /api/chat —— 全仓唯一真花钱的端点
    paths: ${XINYU_QUOTA_PATHS:/api/chat}
  # 情绪词表单一真相源（前端与服务端共用同一份文件）：
  #   ${XINYU_LEXICON} 直接指向文件；未设则用 ${XINYU_WEB_ROOT}/data/emotion-lexicon.js
  #   —— 即 src/data/emotion-lexicon.js（fat jar）或 /app/web/data/...（Docker）。
  #   加载失败会 fail-fast 终止启动，绝不静默回退到旧词表。
  lexicon: ${XINYU_LEXICON:}
  llm:
    # 密钥只从环境变量来：零落盘、零入库。J5 会进一步做外置与最小权限。
    # provider 适配层（对标 LobeChat 多模型）：LLM_* 为通用名，DEEPSEEK_* 保留为兼容别名，
    # 二者都未设时指 DeepSeek 默认值 —— 换任意 OpenAI 兼容上游只改环境变量，不改代码。
    base: ${LLM_BASE:${DEEPSEEK_BASE:https://api.deepseek.com/v1}}
    model: ${LLM_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
    key: ${LLM_KEY:${DEEPSEEK_KEY:}}
  emotion:
    # r70：双路里「LLM 精判」这一腿的请求级超时。聊天链路仍用 60s（长回答要留给它），
    # 但分类只是六选一，8s 拿不到结果就该回落词典 —— 上游挂起时不再占住工作线程一分钟。
    llm-timeout-ms: ${XINYU_EMOTION_LLM_TIMEOUT_MS:8000}
    # 建连超时保持与聊天链路同一个值（10s）——本轮只收紧「分类腿的请求级超时」，
    # 不动任何既有建连预算，避免把 chat 的行为一起改掉。
    connect-timeout-s: ${XINYU_EMOTION_CONNECT_TIMEOUT_S:10}
    # 三级路由（2026-10-08）：lexicon=旧双路原样；auto=危机短路→词典/模型共识→分歧升LLM→词典兜底。
    # model-url 留空 = 本地模型腿整体关闭，auto 行为与旧双路完全一致（零配置零变化）。
    # 共识语义结构性永不倒退：一致时 fin=词典读数；分歧离线落词典；分歧在线与旧「分歧采信 LLM」逐字同。
    route: ${XINYU_EMOTION_ROUTE:auto}
    model-url: ${XINYU_EMOTION_MODEL_URL:}
    model-timeout-ms: ${XINYU_EMOTION_MODEL_TIMEOUT_MS:1500}
  eval:
    # 评测集权威源在项目 _test/ 下（不复制进 jar，避免造第二份副本）
    dataset: ${XINYU_EVAL_DATASET:./_test/emotion-eval-dataset.json}

logging:
  level:
    root: INFO
    com.xinyu.soulisle: INFO
