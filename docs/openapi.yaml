openapi: 3.0.3
info:
  title: 心屿 MindIsle 服务端接口契约
  version: "1.4.0"
  description: |
    **唯一机器可读接口契约**（r21 新增）。三条使用约束，都由 `_test/api_contract_check.py` 机器强制：
    1. **文档不得缺**：`server/**/api/*.java` 里每个 `@*Mapping` 路由必须出现在本文件（漏文档即红）。
    2. **文档不得虚**：本文件声明的路径必须在 Java 控制器里真实存在（幽灵文档即红）。
    3. **前端不得偷调**：`src/js/*.js` 里出现的 `/api/...` 必须已文档化。
    另含运行态对账：对标注 `x-live-check` 的端点向真实服务发请求，断言状态码与响应必需键一致。
    **C6（r22 新增）：每条操作必须"被真实探测"或"显式声明 `x-live-skip` + 理由"**，
    不允许既不探测也不解释 —— 上一轮 C4 写的是 `done >= 8`，而真实操作有 11 条，
    等于用阈值把 3 条未探测的接口静静放过（`/api/memory/emotions`、`/api/memory/messages`、`/api/memory/message`）。

    > 与参照仓的口径坦白：16 个参照仓里只有 **1 家**存在机器可读 API 规范（`api_spec=1/16`），
    > 所以本项**不是"被同类项目甩开"的对标差距**，而是自我登记的可维护性改进
    > （本项目已有 3 个契约测试，但契约分散在 `j2_chat_contract.py` / 前端常量 / 部署文档三处）。
servers:
  - url: http://127.0.0.1:8123
    description: 本地 fat jar（Spring Boot 直读 `src/` 权威源）
  - url: https://xinyu-soulisle.pages.dev
    description: Cloudflare Pages（**只有 /api/chat**，由 Pages Function 实现；其余接口不在此形态暴露）
tags:
  - name: health
  - name: chat
  - name: emotion
  - name: memory
paths:
  /api/health:
    get:
      tags: [health]
      summary: 服务自证（回传可复核判据，不喊口号）
      x-live-check: { method: get, status: [200] }
      responses:
        "200":
          description: UP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/health/db:
    get:
      tags: [health]
      summary: 数据库面自证（r169 另开一面，不并入 /api/health）
      description: |
        回答的是「服务起来了 ≠ 持久化活着」：`/api/health` 只看 `index.html` 与 `vendor` 目录，
        库整面死掉时它仍回 `status=UP`，于是优雅降级缺了输入端。本端点真去连接池取一次连接。
        **永不抛** —— 探测失败本身就是它要报告的内容（回 `status=DOWN` + `error`）。
        另开一面的第二条理由：`/api/health` 被性能判据高频打，在那里加一次真连库往返会把
        「服务本身」的读数变成「库」的读数。
        鉴权边界与 `/api/health` **不同**：`ApiTokenFilter` 只对 `/api/health` 精确放行，
        故配了 `xinyu.api-token` 时本端点需要带 token（它回吐库版本/字符集/表水位，属运维信息）。
      x-live-check: { method: get, status: [200], required_keys: [service, status, acquireMs] }
      responses:
        "200":
          description: 已探到（UP=拿到连接；DOWN=拿到异常）。状态码恒 200，结论在 body 里
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbHealth" }
  /api/chat:
    post:
      tags: [chat]
      summary: LLM 代理（与 v1 Pages Function 契约 1:1，AC-OBS-08）
      description: |
        上游响应**逐字透传**（含上游状态码）。判定顺序与 v1 一致：**先查密钥再解析 body**。
        `stream:true` 且上游返回 SSE ⇒ `text/event-stream` 逐块直通；否则整包 JSON。
      x-live-check: { method: post, body: { messages: [{ role: user, content: "你好" }], max_tokens: 8 }, status: [200] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: 上游正常响应（OpenAI 兼容形状，透传）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
            text/event-stream:
              schema: { type: string, description: "SSE 分片，data: {choices[0].delta.content}" }
        "400": { $ref: "#/components/responses/BadJson" }
        "500":
          description: 服务端未配置密钥（**先于** body 解析判定）
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, example: no-key } } }
        "502":
          description: 上游不可达/失败
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, example: upstream-error } } }
  /api/emotion:
    post:
      tags: [emotion]
      summary: 双路情绪识别（词典快判 + LLM 精判；分歧采信 LLM；危机最高优先）
      description: |
        前端接线自 r20 起（`src/js/emotion-remote.js`）。**危机命中不调用 LLM**（实测 `llm=null` 路径）。
        与 JS 版引擎逐条全等由 `engine_consistency_check.py` 守，双端同句一致由 `emotion_wiring_check.py` W6 守。
      x-live-check:
        method: post
        body: { text: "今天被导师批评了，心情很低落" }
        status: [200]
        required_keys: [lex, final, path]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 识别结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmotionOutcome" }
        "400": { $ref: "#/components/responses/BadJson" }
  /api/emotion/lexicon:
    get:
      tags: [emotion]
      summary: 词表结构导出（JS↔Java 一致性对账的数据源）
      x-live-check: { method: get, status: [200], required_keys: [lex, neg, deg, crisis] }
      responses:
        "200":
          description: 词表 + 否定词 + 程度词 + 危机词
          content:
            application/json:
              schema:
                type: object
                required: [lex, neg, deg, crisis]
  /api/emotion/eval:
    get:
      tags: [emotion]
      summary: 复跑评测集（直读 `_test/emotion-eval-dataset.json`，决策 #5 不复制进 jar）
      parameters:
        - in: query
          name: detail
          schema: { type: integer, enum: [0, 1], default: 0 }
          description: 1 = 额外返回逐条 {text,expect,pred}，供逐条对账（只看汇总会漏个别分叉）
      x-live-check: { method: get, status: [200], required_keys: [total, accuracy, crisis_recall, per_class] }
      responses:
        "200":
          description: 评测汇总
          content:
            application/json:
              schema:
                type: object
                required: [total, accuracy, crisis_recall, per_class]
                properties:
                  total: { type: integer, example: 73 }
                  accuracy: { type: string, example: "98.6%" }
                  crisis_recall: { type: string, example: "6/6" }
        "404":
          description: 评测集文件不可读（`XINYU_EVAL_DATASET` 未指对）
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, example: dataset-not-found } } }
  /api/memory/emotion:
    post:
      tags: [memory]
      summary: 写入一条情绪记录
      x-live-check:
        method: post
        body: { sessionId: "contract-probe", emotion: "sadness", intensity: 0.6 }
        status: [200]
        required_keys: [ok, count]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, emotion]
              properties:
                sessionId: { type: string }
                emotion: { type: string }
                intensity: { type: number, default: 0.5 }
                secondary: { type: string, nullable: true }
                text: { type: string, maxLength: 60 }
      responses:
        "200": { $ref: "#/components/responses/OkCount" }
        "400": { $ref: "#/components/responses/BadJson" }
  /api/memory/emotions:
    get:
      tags: [memory]
      summary: 读取该会话情绪序列（星图重放与曲线的数据源）
      x-live-check:
        method: get
        query: { sessionId: "contract-probe" }
        status: [200]
        required_keys: [emotion, intensity]     # 数组元素键（C4 对 list 取首元素比对）
      parameters:
        - { in: query, name: sessionId, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 200 } }
      responses:
        "200":
          description: 记录数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [emotion, intensity]
                  properties:
                    id: { type: integer }
                    emotion: { type: string }
                    intensity: { type: number }
                    secondary: { type: string, nullable: true }
                    text: { type: string }
                    createdAt: { type: string, nullable: true }
  /api/memory/message:
    post:
      tags: [memory]
      summary: 写入一条对话消息（J4 跨设备记忆的写入面）
      x-live-check:
        method: post
        body: { sessionId: "contract-probe", role: "user", content: "契约探测消息" }
        status: [200]
        required_keys: [ok, count]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, role]
              properties:
                sessionId: { type: string }
                role: { type: string, enum: [user, assistant] }
                content: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OkCount" }
        "400": { $ref: "#/components/responses/BadJson" }
  /api/memory/messages:
    get:
      tags: [memory]
      summary: 读取该会话消息
      x-live-check:
        method: get
        query: { sessionId: "contract-probe" }
        status: [200]
        required_keys: [role, content]
      parameters:
        - { in: query, name: sessionId, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 40 } }
      responses:
        "200":
          description: 消息数组
          content:
            application/json:
              schema:
                type: array
                items: { type: object, required: [role, content] }
  /api/memory/stats:
    get:
      tags: [memory]
      summary: 该会话计数（AC-OBS-10 的"真落库"判据接口）
      parameters:
        - { in: query, name: sessionId, required: true, schema: { type: string } }
      x-live-check: { method: get, query: { sessionId: "contract-probe" }, status: [200], required_keys: [sessionId, emotions, messages] }
      responses:
        "200":
          description: 计数
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, emotions, messages]
  /api/memory/search:
    get:
      tags: [memory]
      summary: 长期记忆检索（r128 新增，BM25 打分，零新依赖）
      description: >-
        在历史消息里检索「说过类似话的那几条」。`sessionId` 可选：给了就在该会话内检索，
        不给就在全库最近 1000 条里检索。中文按二元组（bigram）切分，ASCII 按小写单词切分，
        因此不需要词典与分词库。`score` 只在本次候选集内可比，不是跨查询的绝对相关度。
      parameters:
        - { in: query, name: q, required: false, schema: { type: string }, description: 检索词；空白时返回空结果 }
        - { in: query, name: sessionId, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 10, maximum: 50 } }
      x-live-check: { method: get, query: { q: "hello" }, status: [200], required_keys: [query, pool, count, results] }
      responses:
        "200":
          description: 命中列表（按 BM25 分值递减）
          content:
            application/json:
              schema:
                type: object
                required: [query, pool, count, results]
  /api/memory/export:
    get:
      tags: [memory]
      summary: 导出该会话全部记忆（r130 新增，数据可携带权）
      description: >-
        对应「数据能带走」这半边权利（清除权在 DELETE /api/memory/{sessionId}）。
        **sessionId 必填**：刻意不提供「不传参数就导出全库」的形态 —— 那等于给任何拿到地址的人开全量下载。
        导出件 schema 版本逐字等于 `xinyu-memory/1`，导入端按此比对，不接受模糊匹配。
      parameters:
        - { in: query, name: sessionId, required: true, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 500, maximum: 500 } }
      x-live-check:
        method: get
        query: { sessionId: "contract-probe" }
        status: [200]
        required_keys: [schema, sessionId, counts, messages, emotions]
      responses:
        "200":
          description: 导出件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryExport" }
        "400": { $ref: "#/components/responses/BadJson" }
  /api/memory/import:
    post:
      tags: [memory]
      summary: 导入记忆（r130 新增，幂等）
      description: >-
        **幂等是硬要求**：判重键为消息 (role, content) 与情绪 (emotion, text)，命中即 skipped。
        用户换机器时会「导一次、不确定、再导一次」，不幂等会在几秒内把历史翻倍。
        判重窗口＝该会话最近 500 条（MemoryService.MAX_LIMIT），更深的历史不参与判重。
        单批上限 500 条；结构性错误（schema 不匹配/超限/缺 sessionId）**整批拒绝**，绝不导入一半。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryImport" }
      x-live-check:
        method: post
        body: { schema: "xinyu-memory/1", sessionId: "contract-probe", messages: [{ role: user, content: "导入探测" }], emotions: [{ emotion: "calm", intensity: 0.2, text: "探测" }] }
        status: [200]
        required_keys: [ok, inserted, skipped, rejected]
      responses:
        "200":
          description: 导入结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryImportResult" }
        "400": { $ref: "#/components/responses/BadJson" }
  /api/usage:
    get:
      tags: [health]
      summary: 按日用量读数（r130 新增，成本面总量闸的观测口）
      description: >-
        回传当日累计请求数与估算 token 及两个限额。**token 是「请求体字节数/4」的粗估**，
        不是上游计费口径（响应里带 `tokensAreEstimated:true` 明示），别拿它对账账单。
        本端点只回计数，不含请求体/响应体/会话内容/密钥 —— 泄漏面只有「今天被调用了几次」。
      x-live-check:
        method: get
        status: [200]
        required_keys: [day, requests, tokens, requestLimit, tokenLimit, tokensAreEstimated]
      responses:
        "200":
          description: 用量快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
  /api/memory/{sessionId}:
    delete:
      tags: [memory]
      summary: 清除该会话全部数据（对应界面「清除我的数据」）
      x-live-check: { method: delete, path: "/api/memory/contract-probe", status: [200], required_keys: [ok, removed] }
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已删除条数
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
components:
  schemas:
    Health:
      type: object
      required: [status, webRoot, indexFound, vendorFound]
      properties:
        status: { type: string, example: UP }
        stage: { type: string, example: J5 }
        java: { type: string }
        webRoot: { type: string, description: 绝对路径，自证"直读 src/ 权威源"是否成立 }
        indexFound: { type: boolean }
        vendorFound: { type: boolean }
        build:
          type: string
          description: >-
            **产物身份**（r131 新增）：`jar:<文件名>:<摘要前12>:<字节数>` 或
            `classes:<目录名>:<mtime>`（`spring-boot:run` 直跑 classes 时），取不到为 `unknown`。
            为什么要有这一格：`service/stage/java/webRoot` 在**新旧产物上逐字相同**，
            于是「8123 上跑的其实是他人旧产物（甚至 93,975 B 的瘦 jar 冒充 20MB fat jar）」
            这件事从指纹上完全看不出来，只能靠某个端点超时/404 去猜。
            摘要只取产物前 64 KiB 且只算一次（健康端点会被性能判据高频打，重算会把自己变成被测噪声）。
          example: "jar:soulisle-server.jar:9f2c1a7b3e44:20971520"
    DbHealth:
      type: object
      required: [service, status, acquireMs]
      properties:
        service: { type: string, example: xinyu-soulisle }
        status:
          type: string
          enum: [UP, DOWN]
          description: UP=真的从池里拿到了连接；DOWN=连接/元数据探测抛了异常，本端点把它写成读数而不是写成 5xx
        acquireMs:
          type: number
          description: 取连接（含失败路径）的耗时，毫秒。UP 时是从计时起点到拿到连接，DOWN 时到异常为止
        product: { type: string, description: 仅 UP 时存在，JDBC 元数据 `getDatabaseProductName()`，如 H2 / MySQL }
        productVersion: { type: string, description: 仅 UP 时存在 }
        driver: { type: string, description: 仅 UP 时存在 }
        tables:
          type: object
          description: 仅 UP 时存在；`expected`(应有张数) / `scanned`(实扫到的表名数) / `missing`(缺哪些) / `allPresent`
          properties:
            expected: { type: integer, example: 2 }
            scanned: { type: integer, description: 大小写不敏感比对，H2 折大写而 MySQL 区分大小写 }
            missing: { type: array, items: { type: string } }
            allPresent: { type: boolean }
        charset:
          type: object
          description: 仅 UP 时存在；列级字符集读数（r130 那条「建表没写 DEFAULT CHARSET」缺口的现场尺），非 MySQL 时 `applicable=false`
        pool:
          type: object
          description: >-
            HikariCP 池水位（active/idle/total/waiting）。取连接**之后**才读 —— 池是惰性的，先读会报成 unverified；
            非 Hikari 实现回 `metrics=unavailable`，池未初始化回 `live=unverified(...)`，两者都不许读成「0 条连接、一切正常」。
        error: { type: string, description: 仅 DOWN 时存在，异常类名（不吞消息也不外泄堆栈） }
    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { type: object, required: [role, content] }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ChatResponse:
      type: object
      description: 上游透传，形状由 OpenAI 兼容端决定，本项目不重包装
    MemoryExport:
      type: object
      required: [schema, sessionId, counts, messages, emotions]
      properties:
        schema: { type: string, example: "xinyu-memory/1" }
        exportedAt: { type: string }
        sessionId: { type: string }
        counts:
          type: object
          required: [messages, emotions]
          properties:
            messages: { type: integer }
            emotions: { type: integer }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              createdAt: { type: string, nullable: true }
        emotions:
          type: array
          items:
            type: object
            required: [emotion]
            properties:
              emotion: { type: string }
              intensity: { type: number }
              secondary: { type: string, nullable: true }
              text: { type: string }
              createdAt: { type: string, nullable: true }
    MemoryImport:
      type: object
      required: [schema, sessionId]
      properties:
        schema: { type: string, example: "xinyu-memory/1" }
        sessionId: { type: string }
        messages:
          type: array
          maxItems: 500
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
        emotions:
          type: array
          items:
            type: object
            required: [emotion]
            properties:
              emotion: { type: string }
              intensity: { type: number, default: 0.5 }
              secondary: { type: string, nullable: true }
              text: { type: string }
    MemoryImportResult:
      type: object
      required: [ok, inserted, skipped, rejected]
      properties:
        ok: { type: boolean }
        sessionId: { type: string }
        inserted: { type: integer }
        skipped: { type: integer, description: 与库内或本批次内已有条目重复 ⇒ 未写入 }
        rejected: { type: integer, description: 条目非法（角色越权/内容空白/情绪名为空）⇒ 未写入 }
    Usage:
      type: object
      required: [day, requests, tokens, requestLimit, tokenLimit, tokensAreEstimated]
      properties:
        day: { type: string, example: "2026-10-12" }
        requests: { type: integer }
        tokens: { type: integer }
        requestLimit: { type: integer, description: "0 = 不限" }
        tokenLimit: { type: integer, description: "0 = 不限" }
        tokensAreEstimated: { type: boolean, example: true }
    EmotionOutcome:
      type: object
      required: [lex, final, path]
      properties:
        lex:
          type: object
          required: [emotion, intensity, color, all]
          properties:
            crisis: { type: boolean }
            emotion: { type: string }
            intensity: { type: number }
            color: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
            all: { type: array, items: { type: object, required: [emotion, score] } }
        llm:
          nullable: true
          type: object
          properties:
            emotion: { type: string }
            intensity: { type: number }
        final:
          type: object
          required: [emotion, intensity]
        path: { type: string, description: 判定路径，界面如实展示（禁伪装在线） }
        secondary: { type: string, nullable: true }
        label: { type: string }
        color: { type: array, items: { type: number } }
  responses:
    BadJson:
      description: 请求体非法或缺必填（`bad-json`；/api/emotion 缺 text 亦此码）
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string, example: bad-json } } }
    OkCount:
      description: 写入成功并回该会话累计条数
      content:
        application/json:
          schema:
            type: object
            required: [ok, count]
            properties:
              ok: { type: boolean }
              count: { type: integer }
