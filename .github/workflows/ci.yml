name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-checks:
    name: 同步守卫 + 情绪评测/策略表门禁 + 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: src → deploy/xinyu SHA256 三类归零
        run: python _test/deploy_sync_check.py
      - name: 静态资源体积预算守卫（首屏优势不回涨，含 --selftest 防恒真）
        run: |
          python _test/size_budget_check.py
          python _test/size_budget_check.py --selftest
      - name: vendor 供给链守卫（完整性哈希 + 版本声明对账 + 漏登记即红，含 --selftest）
        run: |
          python _test/vendor_freshness_check.py
          python _test/vendor_freshness_check.py --selftest
      - name: 对标源数据台账自证（漂移判据非恒真；联网采集属人工轮次动作，不在 CI 里跑）
        run: python _test/benchmark_metrics.py --selftest
      - name: 情绪评测集门禁（accuracy ≥ 95% 且危机全召回）
        run: |
          node _test/emotion_eval.js > /tmp/eval.json
          cat /tmp/eval.json
          python - <<'EOF'
          import json, sys
          d = json.load(open("/tmp/eval.json"))
          acc = float(d["accuracy"].rstrip("%"))
          hit, total = map(int, d["crisis_recall"].split("/"))
          print(f"accuracy={acc}% crisis={hit}/{total}")
          if acc < 95.0 or hit != total:
              sys.exit(1)
          EOF
      - name: 共情策略表 ↔ 词表成对性门禁（含 --selftest 防判据恒真）
        run: |
          python _test/strategy_check.py
          python _test/strategy_check.py --selftest
      - name: 密钥零入库扫描（含"判据必须能抓到东西"的对照组）
        run: |
          set -e
          # 对照组：先证明这条正则在**本环境**确实抓得到东西，否则"0 命中"没有意义（R247）。
          # 密钥串必须**拼接生成** —— 直接写死 30 位字面量会让本文件自己命中这条扫描（本机实测踩过）。
          printf 'demo sk-%s\n' "$(printf 'a%.0s' $(seq 1 30))" > /tmp/keycanary
          if ! grep -lE "sk-[A-Za-z0-9]{20,}" /tmp/keycanary >/dev/null; then
            echo "对照组失败：正则抓不到已知密钥 ⇒ 本步判据恒真，拒绝放行"; exit 1
          fi
          rm -f /tmp/keycanary
          # 真实扫描：只扫 git 跟踪的文件（工作区可能含未跟踪的本机演示配置，如 src/js/demo-config.js）
          if git ls-files -z | xargs -0 -r grep -lIE "sk-[A-Za-z0-9]{20,}" 2>/dev/null; then
            echo "🔴 检出疑似真实密钥，禁止入库"; exit 1
          fi
          echo "✅ KEY-SCAN-PASS（跟踪文件 0 命中，对照组已证非恒真）"

  java-build:
    name: Java 服务端构建 + 词表一致性红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: mvn package
        run: mvn -B -ntp -f server/pom.xml package
      # 项目铁律：情绪引擎 JS/Java 两份实现必须逐项一致（词表结构 / 73 条逐条预测 / 汇总指标）。
      # 此前这条红线**只写在 memory/AGENTS.md 里靠人记**，本步把它变成机器门禁。
      # /api/emotion/* 不调用上游 LLM ⇒ 无需任何密钥即可跑，公开仓库也安全。
      - name: 起 fat jar（无密钥，仅情绪接口）并跑双端一致性对账
        env:
          XINYU_WEB_ROOT: ${{ github.workspace }}/src
        run: |
          set -e
          java -jar server/target/soulisle-server.jar --server.port=8123 > /tmp/xinyu-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8123/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/api/health
          python _test/engine_consistency_check.py

  browser-regression:
    name: 浏览器回归（降级链路 + 星雾点亮 + 危机拦截）
    runs-on: ubuntu-latest
    env:
      # runner 无 GPU：强制 ANGLE/SwiftShader 软件光栅化，否则 WebGL 起不来会假红
      # （判据里 `lit1 > 0` 依赖 ThreeScene 真在跑）
      XINYU_BROWSER_ARGS: "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      # 全新 clone 里没有 src/js/demo-config.js（它持本机真实 Key，被 .gitignore 排除）。
      # index.html 用 <script> 静态引它 → 缺失就是首屏 3 个 404，会打破 browser_check 的
      # 「console 0 报错」判据（本机看不到这个坑，CI 第一次跑就抓到了）。
      # 正解与"新用户拿到仓库怎么跑"一致：把公网零密钥自适应 stub 复制成本机演示配置。
      - name: 补齐演示配置占位（零密钥，与 CONTRIBUTING 同口径）
        run: |
          if [ ! -f src/js/demo-config.js ]; then
            cp deploy/xinyu/js/demo-config.js src/js/demo-config.js
            echo "已从公网零密钥 stub 复制为本机演示配置占位"
          else
            echo "src/js/demo-config.js 已存在，跳过"
          fi
          if grep -qE "sk-[A-Za-z0-9]{20,}" src/js/demo-config.js; then
            echo "🔴 演示配置含真实密钥，禁止在 CI 中使用"; exit 1
          fi
          echo "demo-config 占位就绪（零密钥）"
      - name: 起 fat jar（工作目录=仓库根，直读 src/）
        run: |
          mvn -B -ntp -f server/pom.xml package -DskipTests
          java -jar server/target/soulisle-server.jar --server.port=8123 > /tmp/xinyu-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8123/api/health > /dev/null; then break; fi
            sleep 1
          done
      # 判据本身自带对照组：不可达端点 18123 必须回落离线模板，出现「在线大模型生成」即 FAIL
      - name: 降级链路 + 情绪点亮 + 危机拦截 + 滚动淡入淡出
        run: python _test/browser_check.py

  live-sync:
    name: 线上↔权威源逐字节新鲜度（仅 main push，漂移告警不阻塞）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 公网 pages.dev 原样托管 deploy/xinyu（实测逐字节相等），比对失败=部署未跟进提交。
      # 反例已证非恒真：指到 example.com 该脚本 rc=1。环境不可达 rc=2 与漂移 rc=1 分离。
      - name: live_sync_check
        run: python _test/live_sync_check.py
