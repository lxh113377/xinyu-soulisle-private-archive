name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-checks:
    name: 同步守卫 + 情绪评测门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: src → deploy/xinyu SHA256 三类归零
        run: python _test/deploy_sync_check.py
      - name: 情绪评测集门禁（accuracy ≥ 95% 且危机全召回）
        run: |
          node _test/emotion_eval.js > /tmp/eval.json
          cat /tmp/eval.json
          python - <<'EOF'
          import json, sys
          d = json.load(open("/tmp/eval.json"))
          acc = float(d["accuracy"].rstrip("%"))
          hit, total = map(int, d["crisis_recall"].split("/"))
          print(f"accuracy={acc}% crisis={hit}/{total}")
          if acc < 95.0 or hit != total:
              sys.exit(1)
          EOF

  java-build:
    name: Java 服务端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn package
        run: mvn -B -ntp -f server/pom.xml package
