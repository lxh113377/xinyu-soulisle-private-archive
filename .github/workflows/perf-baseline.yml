# 性能基线回归 —— 自身棘轮，**不是**跨项目对比。
#
# 为什么单独成一个 workflow（而不是塞进 ci.yml 的一个 step）：
#   ci_perf_step 这条对标杠篏的是「有没有一个专门跑性能的工作流文件」，但那只是副产品——
#   真正的动因是 ci.yml 的 java-build 已经挂了 mvn verify + fat jar 校验 + 双端对账 + Docker 起服，
#   再往上叠线程池压测，会让「红了是性能退化还是 ITSM 抖动/给 runner 争抢」无法归因。
#   独立文件 ⇒ ① 红因单一 ② 可以定触发频率（周常 + server/src/测试脚本变动），不必每次 PR 付费。
#
# 口径铁律（改这个文件前先读 _test/perf_baseline_check.py 顶部注释）：
#   · 只打本地无外网的三条面 + /api/emotion 危机短路路径；危机句一旦走到 LLM，判据自己判红。
#   · 阈值是本机实测的约 20 倍余量，抓的是数量级退化（直读变落库 / 线程池打满），不是抖动。
#   · 服务起不来时脚本 rc=2「未验证」，CI 里 rc=2 会让 job 红 —— 未验不得当成通过。
name: Perf Baseline

on:
  workflow_dispatch:
  # 周常：性能退化和信息安全缺失不同，不需要每次提交都付一遍构建成本
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "_test/perf_baseline_check.py"
      - "_test/ci_perf_wiring_check.py"
      - ".github/workflows/perf-baseline.yml"

permissions:
  contents: read

concurrency:
  group: perf-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: 性能基线（p95 预算 + 吞吐地板 + 危机路径口径守卫）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # 漏装会让 perf_baseline_check 以 rc=2「环境异常」报出，和真退化混在一起 ⇒ 单一清单、显式安装
      - name: 装判据第三方依赖（单一清单）
        run: pip install -r _test/requirements.txt
      # 与 ci.yml 的 java-build 同相位（verify），不写 package、不带 -DskipTests：
      # 覆盖率门绑在 verify，写成 package 这道门一次也不会执行（r75 同族口径陷阱）。
      - name: 构建 fat jar（mvn verify）
        run: mvn -B -ntp -f server/pom.xml verify
      # 产物自证先行（r20 实证）：jar 进程存活时构建会留下瘦 jar，而旧进程照常回 200 ⇒ 假健康。
      # 瘦 jar 跑出来的延迟是"内存里那个 jar"的，不是本次构建的产物 ⇒ 先卡体积再看性能。
      - name: 校验 fat jar 产物（防"瘦 jar 冒充 fat jar"）
        run: |
          set -e
          SZ=$(stat -c%s server/target/soulisle-server.jar)
          echo "soulisle-server.jar = $SZ bytes"
          if [ "$SZ" -lt 20000000 ]; then
            echo "🔴 产物仅 $SZ B ⇒ repackage 未生效，这份被测对象不代表本次构建"; exit 1
          fi
          unzip -l server/target/soulisle-server.jar | grep -q "BOOT-INF/lib/" || { echo "🔴 缺 BOOT-INF/lib ⇒ 瘦 jar"; exit 1; }
          echo "✅ FAT-JAR-OK"
      - name: 起 fat jar 并跑性能基线
        env:
          XINYU_WEB_ROOT: ${{ github.workspace }}/src
          # r172：这一 job 必须显式关闸，否则并发那一半没有读数。
          # 一手读数（同机备用实例，落盘件在 交付物/对标数据/perf-*-2026-10-13-r172-*）：
          #   带默认闸（burst=20）跑单点档 8 线程×6=48 发 ⇒ /api/emotion 只有 18/48 拿到 2xx，
          #   其余 30 发是 429 ⇒ 该面记「无读数」，整轮 rc=2；同批 /api/health（OPEN_PATH 豁免面）
          #   48 发全过 ⇒ 1859.2 rps 有数——**一条面有数、另一条没数**，所以不能拿"吞吐有读数"当整轮可用。
          #   把桶开到 96（--xinyu.guard.burst=96）能让单点档跑全：emotion 1550.9 rps @ 48 发、Remaining=95。
          #   阶梯档跑不全：64 线程档每个 rep 对 /api/emotion 就是 64×32=2048 发，一档 5 次 + 1 次热身
          #   ⇒ 12288 发，没有任何 burst 取值能让带闸实例过完整条曲线（把 burst 调到能过，等于用「改配置」
          #   把一个真实缺陷登记成配置噪声），所以选 enabled=false 而不是加大 burst。
          # 关闸不等于这道门消失：限流/体积/豁免的行为由构建期 server/src/test/.../ApiGuardFilterTest
          # 钉住（mvn verify 在本 step 之前已跑），而 perf_baseline_check 每次落账都印「闸态=…」行——
          # 带闸与不带闸的两份台账从此不可混用；并发档被闸拦掉时判据出 rc=2 并点名被拦面，
          # 不再像修前那样崩成「仪器异常 HTTPError 429」（HEAD 那份脚本在同一台带闸实例上实测的终态）。
          XINYU_GUARD_ENABLED: "false"
        run: |
          set -e
          java -jar server/target/soulisle-server.jar --server.port=8123 > /tmp/xinyu-perf-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8123/api/health > /dev/null; then break; fi
            sleep 1
          done
          # 等不到 health 就直接让 job 红：这里的失败原因必须是"起服失败"而不是"性能退化"
          curl -sf http://127.0.0.1:8123/api/health
          python _test/perf_baseline_check.py --json /tmp/perf-baseline.json
          # r96：阶梯并发曲线在受理面上也跑（本地默认关，是为了不推高电池 wall-clock）。
          # 立因：r95 报告 §1 印 1013.9 rps 而 §5 称「并发维度仍无读数」——两句都对但口径没写在数字上。
          # 这条同时是 docs/PERF-BASELINE.md 那张表的复算位。
          python _test/perf_baseline_check.py --ramp 8,16,32,64 --ramp-budget 60 \
            --json /tmp/perf-ramp.json
      # 判据自证必须和真跑同批：只跑不验的话，"恒慢样本会不会被判红"永远没人知道，
      # 而一条从不红的的性能门禁，和没有门禁在受理面上没有区别（r41 同族）。
      - name: 判据自证（恒慢/空样本/缺面/口径漂移必须红）
        run: python _test/perf_baseline_check.py --selftest
      # 接线自证：workflow 存在不等于它真在跑性能判据（C-IPW 五条，见判据顶部注释）
      - name: 接线自证（perf workflow ⇄ 判据 ⇄ README 数字 ⇄ 基线文档）
        run: |
          python _test/ci_perf_wiring_check.py
          python _test/ci_perf_wiring_check.py --selftest
      - name: 落服务日志（红因归因用，失败也要留）
        if: always()
        run: cat /tmp/xinyu-perf-server.log || true
