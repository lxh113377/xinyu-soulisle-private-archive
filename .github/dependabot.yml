version: 2
# 对标轮 r21：纠正 r20 自己写下的**错误归因**——
# 上一轮技术债记的是"心屿零构建 ⇒ 挂不上 dependabot（没有 package.json）"。
# 这话只对了一半：`src/vendor/` 里的三个前端库确实没有包管理器可托管（那部分由
# `_test/vendor-manifest.json` + `vendor_freshness_check.py` 承担）；
# 但 **Maven（server/pom.xml）与 GitHub Actions（.github/workflows）两个 ecosystem 与 npm 无关**，
# 完全可以直接挂 dependabot。r20 的判断把"npm 挂不上"扩大成了"整个项目挂不上"，据此放弃了本可自动化的两半。
updates:
  - package-ecosystem: "maven"
    directory: "/server"
    schedule: { interval: "weekly", day: "tuesday", time: "08:00", timezone: "Asia/Shanghai" }
    open-pull-requests-limit: 3
    # r50 加：不提 major。依据是自家 receipts，不是通用洁癖——
    #   · PR #1/#3（actions/checkout 4→7、setup-python 5→7）是 major，**已正常合并** ⇒ actions 侧无此症状；
    #   · PR #2（spring-boot-starter-parent 3.2.5→4.1.1）同为 major，却 java-build 30s 即 fail、
    #     从 09-24 常红到 r50 ⇒ Spring Boot 跨大版本属破坏性升级，不该由 dependabot 直送。
    # 症状不是"dependabot 没用"，是"配置在册但策略缺失"：一张永远合不了的 PR 挂着，
    # 会把真正该看的那张（patch/minor 安全升级）淹掉。判据 = repo_config_check.py G1b。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
        versions: [">= 4.0.0-0"]
    commit-message: { prefix: "chore(deps-maven)" }
    labels: ["dependencies", "java"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "tuesday", time: "08:00", timezone: "Asia/Shanghai" }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(deps-actions)" }
    labels: ["dependencies", "ci"]
